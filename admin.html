<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="description" content="Administration ERP NYSOA BTP — Import, sauvegarde, gestion utilisateurs">
    <title>NySoa BTP — Administration</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2B3A">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="enhancements.js"></script>
    <script src="stock.js"></script>
    <script src="devis.js"></script>
    <script src="import-excel.js"></script>
    <script src="modules_new.js"></script>
    <style>
        /* ── CONFIG SUPABASE — même valeurs que supabase.js ── */
        :root {
            --dark:   #1C2B3A;
            --orange: #E8631A;
            --green:  #10b981;
            --red:    #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f6fa;
            color: #2d3436;
        }

        .app { display: flex; min-height: 100vh; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 240px; flex-shrink: 0;
            background: var(--dark); color: white;
            display: flex; flex-direction: column;
            padding: 24px 0; position: sticky; top: 0; height: 100vh;
        }
        .logo { padding: 0 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo .icon { width: 44px; height: 44px; background: rgba(232,99,26,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo .icon span { font-size: 20px; font-weight: 800; color: var(--orange); font-family: Georgia; }
        .logo h2 { font-size: 15px; font-weight: 600; }
        .logo p  { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }

        nav { flex: 1; padding: 16px 12px; }
        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            color: rgba(255,255,255,0.65); font-size: 14px;
            transition: all 0.2s; text-decoration: none; margin-bottom: 2px;
        }
        .nav-item:hover, .nav-item.active { background: rgba(232,99,26,0.15); color: white; }
        .nav-item i { width: 18px; text-align: center; }

        .user-info { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 34px; height: 34px; background: var(--orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-details p:first-child { font-size: 13px; font-weight: 600; }
        .user-details p:last-child  { font-size: 11px; color: rgba(255,255,255,0.5); }

        /* ── MAIN ── */
        .main { flex: 1; padding: 28px 32px; max-width: 960px; }

        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 22px; font-weight: 700; color: var(--dark); }
        .page-header p  { font-size: 14px; color: #636e72; margin-top: 4px; }

        /* ── CARDS ── */
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
        @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }

        .card {
            background: white; border-radius: 14px;
            padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .card-icon {
            width: 42px; height: 42px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .card-icon.orange { background: rgba(232,99,26,0.12); color: var(--orange); }
        .card-icon.blue   { background: rgba(0,102,204,0.10); color: #0066cc; }
        .card-icon.green  { background: rgba(16,185,129,0.12); color: var(--green); }
        .card-icon.red    { background: rgba(239,68,68,0.10);  color: var(--red); }
        .card h3 { font-size: 15px; font-weight: 600; }
        .card p  { font-size: 13px; color: #636e72; }

        /* ── IMPORT ZONE ── */
        .import-zone {
            border: 2px dashed #dee2e6; border-radius: 10px;
            padding: 28px 20px; text-align: center; cursor: pointer;
            transition: all 0.2s; background: #f8f9fa;
        }
        .import-zone:hover, .import-zone.drag-over {
            border-color: var(--orange); background: rgba(232,99,26,0.04);
        }
        .import-zone i { font-size: 32px; color: #adb5bd; margin-bottom: 10px; }
        .import-zone .drag-over i { color: var(--orange); }
        .import-zone p { font-size: 14px; color: #636e72; margin-bottom: 4px; }
        .import-zone small { font-size: 12px; color: #adb5bd; }
        .import-zone input { display: none; }

        /* ── FICHIERS IMPORTÉS ── */
        .file-list { margin-top: 14px; }
        .file-item {
            display: flex; align-items: center; gap: 10px;
            background: #f8f9fa; border: 1px solid #e9ecef;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
        }
        .file-item i { color: var(--orange); }
        .file-item .fname { flex: 1; font-size: 13px; font-weight: 600; }
        .file-item .fstatus { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .status-ready   { background: #e8f5e9; color: #2e7d32; }
        .status-loading { background: #fff8e1; color: #f57f17; }
        .status-done    { background: #e3f2fd; color: #1565c0; }
        .status-error   { background: #ffebee; color: #c62828; }

        /* ── PROGRESS ── */
        .progress-wrap { margin-top: 14px; display: none; }
        .progress-bar { height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--orange); border-radius: 10px; transition: width 0.3s; }
        .progress-text { font-size: 12px; color: #636e72; margin-top: 6px; text-align: center; }

        /* ── BOUTONS ── */
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 18px; border-radius: 8px; font-size: 14px;
            font-weight: 600; border: none; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: var(--orange); color: white; }
        .btn-primary:hover { background: #c95215; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: #f1f3f4; color: #444; }
        .btn-secondary:hover { background: #e2e5e8; }
        .btn-dark { background: var(--dark); color: white; }
        .btn-dark:hover { background: #2d4a6b; }
        .btn-green { background: var(--green); color: white; }
        .btn-green:hover { background: #059669; }
        .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

        /* ── STATS IMPORT ── */
        .import-stats {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; margin-top: 14px;
        }
        .stat-box { background: #f8f9fa; border-radius: 8px; padding: 12px; text-align: center; }
        .stat-box .count { font-size: 22px; font-weight: 700; color: var(--dark); }
        .stat-box .label { font-size: 11px; color: #636e72; margin-top: 2px; }

        /* ── BACKUP SECTION ── */
        .backup-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border: 1px solid #e9ecef;
            border-radius: 8px; margin-bottom: 8px; background: white;
        }
        .backup-item i { font-size: 20px; color: #0066cc; }
        .backup-item .bname { flex: 1; }
        .backup-item .bname strong { font-size: 13px; display: block; }
        .backup-item .bname small { font-size: 12px; color: #636e72; }
        .backup-item .bdate { font-size: 12px; color: #adb5bd; }

        /* ── LOG ── */
        .log-box {
            background: #1e1e1e; color: #d4d4d4;
            border-radius: 8px; padding: 16px; font-family: monospace;
            font-size: 12px; line-height: 1.8; max-height: 200px; overflow-y: auto;
            display: none;
        }
        .log-box .ok   { color: #4ec9b0; }
        .log-box .warn { color: #dcdcaa; }
        .log-box .err  { color: #f44747; }

        /* ── NOTIFICATION ── */
        .notif {
            position: fixed; top: 20px; right: 20px;
            padding: 14px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 600; z-index: 9999;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 8px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .notif-success { background: white; border-left: 4px solid var(--green); color: #2d3436; }
        .notif-error   { background: white; border-left: 4px solid var(--red);   color: #2d3436; }
        .notif-info    { background: white; border-left: 4px solid #0066cc;       color: #2d3436; }

        .full-card { grid-column: 1 / -1; }
        .section-title { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .divider { border: none; border-top: 1px solid #f0f0f0; margin: 24px 0; }
    </style>
</head>

</html>
