    <style>
        /* ── ÉDITEUR DEVIS ── */
        .ed-lot {
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }
        .ed-lot-header {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: #f8f9fa;
            cursor: pointer; user-select: none;
        }
        .ed-lot-num {
            font-size: 12px; font-weight: 700; color: #1C2B3A;
            min-width: 22px;
        }
        .ed-lot-titre {
            flex: 1; font-size: 14px; font-weight: 600; color: #1C2B3A;
            border: none; background: transparent; outline: none;
            cursor: pointer;
        }
        .ed-lot-titre:focus { background: white; border-radius: 4px; padding: 2px 6px; }
        .ed-lot-total {
            font-size: 13px; font-weight: 600; color: #1C2B3A;
            min-width: 130px; text-align: right;
        }
        .ed-del-lot {
            opacity: 0; transition: opacity 0.15s; color: var(--red) !important;
        }
        .ed-lot-header:hover .ed-del-lot { opacity: 1; }
        .ed-table {
            width: 100%; border-collapse: collapse;
        }
        .ed-table thead tr { background: #f8f9fa; }
        .ed-table th {
            font-size: 11px; font-weight: 600; color: #888;
            padding: 7px 8px; border-bottom: 1px solid #e9ecef; text-align: left;
        }
        .ed-table td {
            padding: 5px 6px; border-bottom: 1px solid #f0f0f0; font-size: 12px;
        }
        .ed-table td input {
            width: 100%; background: transparent; border: none; font-size: 12px;
            color: #1a1a1a; outline: none; padding: 2px 0;
        }
        .ed-table td input:focus {
            background: #f5f6fa; border-radius: 3px; padding: 2px 4px;
        }
        .ed-table tr:last-child td { border-bottom: none; }
        .ed-add-ligne {
            padding: 8px 14px; font-size: 12px; color: #888;
            cursor: pointer; border-top: 1px solid #f0f0f0;
            display: flex; align-items: center; gap: 6px;
        }
        .ed-add-ligne:hover { color: var(--orange); background: #fff8f5; }
        .ed-total-row {
            display: flex; justify-content: space-between;
            padding: 7px 14px; font-size: 12px; border-bottom: 1px solid #e9ecef;
        }
        .ed-total-row span:first-child { color: #888; }
        .ed-total-row span:last-child { font-weight: 600; color: #1C2B3A; }
    </style>
