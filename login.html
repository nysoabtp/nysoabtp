<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NySoa BTP - Connexion</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1C2B3A">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1C2B3A 0%, #2d4a6b 100%);
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .logo { text-align:center; margin-bottom:36px; }
        .logo-icon {
            width: 72px; height: 72px; border-radius: 18px;
            background: #1C2B3A; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-icon span {
            font-size: 28px; font-weight: 800; color: #E8631A;
            font-family: Georgia, serif;
        }
        .logo h1 { font-size: 22px; color: #1C2B3A; font-weight: 700; }
        .logo p  { font-size: 14px; color: #888; margin-top: 4px; }

        label { display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }

        input {
            width: 100%; padding: 13px 16px;
            border: 1.5px solid #e0e0e0; border-radius: 10px;
            font-size: 15px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 18px;
        }
        input:focus { border-color: #E8631A; box-shadow: 0 0 0 3px rgba(232,99,26,0.12); }

        .btn {
            width: 100%; padding: 14px;
            background: #E8631A; color: white;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            letter-spacing: 0.3px;
        }
        .btn:hover { background: #c95215; transform: translateY(-1px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        .error-msg {
            background: #fef2f2; border: 1px solid #fecaca;
            color: #dc2626; border-radius: 8px;
            padding: 10px 14px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }
        .success-msg {
            background: #f0fdf4; border: 1px solid #bbf7d0;
            color: #16a34a; border-radius: 8px;
            padding: 10px 14px; font-size: 13px;
            margin-bottom: 16px; display: none;
        }

        .comptes {
            margin-top: 24px;
            background: #f8f9fa; border-radius: 10px;
            padding: 16px;
        }
        .comptes h4 { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .compte-item {
            display: flex; justify-content: space-between;
            padding: 7px 0; border-bottom: 1px solid #eee;
            font-size: 13px; cursor: pointer;
        }
        .compte-item:last-child { border-bottom: none; }
        .compte-item:hover { background: #f0f0f0; border-radius: 6px; padding-left: 6px; }
        .compte-item .role { color: #555; font-weight: 600; }
        .compte-item .cred { color: #E8631A; font-family: monospace; font-size: 12px; }

        .loading { display:none; text-align:center; color:#888; font-size:13px; margin-top:10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <img src="LOGO_NYSOA.png" alt="NySoa Construct" style="height:130px;width:auto;object-fit:contain;margin-bottom:8px">
        <h1>NySoa BTP</h1>
        <p>Système de Gestion ERP</p>
    </div>

    <div id="error-msg"  class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <form id="form-login">
        <label>Email</label>
        <input type="email" id="email" placeholder="votre@email.com" required>

        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" class="btn" id="btn-login">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
    </form>

    <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i> Connexion en cours...
    </div>

    <!-- Comptes démo supprimés (audit #11) — ne pas remettre en production -->
</div>

<script>
// ── CONFIG SUPABASE — remplacer avec vos vraies valeurs ──────
const SUPABASE_URL = 'https://djncsybvloyyesllfxhq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbmNzeWJ2bG95eWVzbGxmeGhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NDI1OTksImV4cCI6MjA5MzMxODU5OX0.o4MOSg6axYoNdl0XgidLi0eNukR-KwnKvecZxchkcP8';
// ─────────────────────────────────────────────────────────────

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Redirection selon le rôle
const DASHBOARDS = {
    admin:       'index.html',
    daf:         'daf.html',
    chef:        'chef-chantier.html',
    rh:          'rh.html',
    controleur:  'controleur.html',
    technicien:  'technicien.html',
};

function showError(msg)   { const el = document.getElementById('error-msg');   el.textContent = msg; el.style.display = 'block'; document.getElementById('success-msg').style.display = 'none'; }
function showSuccess(msg) { const el = document.getElementById('success-msg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('error-msg').style.display = 'none'; }
function hideMessages()   { document.getElementById('error-msg').style.display = 'none'; document.getElementById('success-msg').style.display = 'none'; }

// ── Connexion via Supabase Auth uniquement ───────────────────
document.getElementById('form-login').addEventListener('submit', async function(e) {
    e.preventDefault();
    hideMessages();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const loading  = document.getElementById('loading');

    btn.disabled = true;
    loading.style.display = 'block';

    try {
        const { data, error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Le rôle est dans user_metadata (défini au moment de la création du compte)
        const role = data.user?.user_metadata?.role;
        if (!role) throw new Error('Rôle non défini pour ce compte. Contactez l\'administrateur.');

        const destination = DASHBOARDS[role];
        if (!destination) throw new Error(`Rôle inconnu : "${role}"`);

        // localStorage = cache d'affichage uniquement (nom, email)
        // La vraie autorisation repose sur la session Supabase
        localStorage.setItem('nysoa_current_user', JSON.stringify({
            email: data.user.email,
            role,
            nom: data.user?.user_metadata?.nom || email.split('@')[0],
        }));

        showSuccess('Connexion réussie ! Redirection...');
        setTimeout(() => { window.location.href = destination; }, 800);

    } catch (err) {
        console.error('[Login]', err);
        showError(err.message?.includes('Invalid login')
            ? 'Email ou mot de passe incorrect'
            : err.message || 'Erreur de connexion');
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
});

// ── Si session active → rediriger directement ────────────────
window.addEventListener('load', async () => {
    try {
        const { data } = await db.auth.getSession();
        if (data?.session) {
            const role = data.session.user?.user_metadata?.role;
            if (role && DASHBOARDS[role]) {
                window.location.href = DASHBOARDS[role];
            }
        }
    } catch(e) { console.warn('[Login] getSession:', e); }
});
</script>
</body>
</html>
