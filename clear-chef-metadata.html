<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nettoyer metadata chef</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<style>body{font-family:sans-serif;max-width:500px;margin:40px auto;padding:20px}
button{padding:12px 24px;font-size:16px;background:#0066cc;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:hover{background:#0052a3}.msg{margin-top:16px;padding:12px;border-radius:6px}
.ok{background:#d4edda;color:#155724}.err{background:#f8d7da;color:#721c24}
pre{background:#f5f5f5;padding:10px;border-radius:4px;font-size:12px}</style>
</head><body>
<h2>Nettoyer le chantier du chef</h2>
<p><button id="btn-login">1. Se connecter en tant que chef</button></p>
<p><button id="btn-clear" disabled>2. Supprimer le chantier assigné</button></p>
<div id="msg"></div>

<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const btnLogin = document.getElementById('btn-login');
const btnClear = document.getElementById('btn-clear');
const msg = document.getElementById('msg');

btnLogin.onclick = async () => {
  btnLogin.disabled = true;
  msg.innerHTML = '<div class="msg">Connexion en cours...</div>';
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email: 'chef@nysoa.mg', password: 'chef123' });
    if (error) throw error;
    msg.innerHTML = '<div class="msg ok">Connecté ✓</div>';
    btnClear.disabled = false;
  } catch(e) {
    msg.innerHTML = `<div class="msg err">${e.message}</div>`;
    btnLogin.disabled = false;
  }
};

btnClear.onclick = async () => {
  btnClear.disabled = true;
  msg.innerHTML = '<div class="msg">Suppression en cours...</div>';
  try {
    const meta = supabase.auth.user()?.user_metadata || {};
    delete meta.chantier;
    const { data, error } = await supabase.auth.updateUser({ data: meta });
    if (error) throw error;
    msg.innerHTML = '<div class="msg ok">✓ chantier supprimé du metadata. Déconnecte-toi et reconnecte-toi.</div>';
  } catch(e) {
    msg.innerHTML = `<div class="msg err">${e.message}</div>`;
    btnClear.disabled = false;
  }
};
</script>
</body></html>
